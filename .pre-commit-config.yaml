# `pre-commit install` runs these on every commit; CI runs them on all files.
exclude: ^tests/data/

ci:
  autoupdate_commit_msg: "chore(pre-commit): update hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^src/
        args: []

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli; python_version<'3.11'"]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  # NEWS.md keeps the bullets and wrapping of the release notes
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap=keep, --compact-tables]
        additional_dependencies: [mdformat-gfm]
        exclude: ^NEWS\.md$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dashes
        language: pygrep
        entry: "\u2014"
        types: [text]
