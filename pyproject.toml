[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "symident"
version = "0.18.2"
description = "Structural identifiability of ODE models by Lie symmetries over finite fields"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Beyer", email = "simon.beyer@fdm.uni-freiburg.de" }]
keywords = ["structural identifiability", "Lie symmetries", "ODE models", "systems biology",
            "finite fields", "reparametrization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "sympy>=1.12", "scipy>=1.11", "python-flint>=0.7.0"]

[project.urls]
Homepage = "https://github.com/dModverse/symident"
Documentation = "https://dmodverse.github.io/symident/"
Source = "https://github.com/dModverse/symident"
Issues = "https://github.com/dModverse/symident/issues"

[project.optional-dependencies]
petab = ["python-libsbml>=5.20", "pyyaml>=6"]
test = ["pytest>=9", "pytest-xdist", "pytest-timeout", "python-libsbml>=5.20", "pyyaml>=6"]
docs = ["sphinx>=8", "numpydoc", "pydata-sphinx-theme", "myst-parser", "sphinxcontrib-bibtex>=2.6"]

# the extras above stay for `pip install symident[test]`; the groups serve uv, nox and `pip install --group`
[dependency-groups]
test = ["pytest>=9", "pytest-xdist", "pytest-timeout", "python-libsbml>=5.20", "pyyaml>=6"]
docs = ["sphinx>=8", "numpydoc", "pydata-sphinx-theme", "myst-parser", "sphinxcontrib-bibtex>=2.6"]
dev = [{ include-group = "test" }, { include-group = "docs" }, "nox", "pre-commit"]

[tool.scikit-build]
wheel.packages = ["src/symident"]
cmake.build-type = "Release"
sdist.exclude = ["tests/data"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
# SciPy ships no wheels for manylinux2014 any more; the test install would build it
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "pytest-xdist", "pytest-timeout", "python-libsbml", "pyyaml"]
# the full suite on the oldest and the newest Python; the wheels of all are built
test-skip = "cp311-* cp312-* cp313-* cp314-*"
test-command = 'pytest -q -n auto {project}/tests'

[tool.pytest.ini_options]
minversion = "9"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
log_level = "INFO"
# the fork warning of Python and the warnings symident emits by design, in tests that do not assert them;
# a colon in a message is written as "."
filterwarnings = [
    "error",
    'ignore:This process \(pid=\d+\) is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning',
    "ignore:estimated parameters without effect on the model as fitted:UserWarning",
    'ignore:equilibrate. at \d+ of \d+ random parameter values the resting balances have no solution:UserWarning',
    "ignore:`positive` names .* (is|are) no symbol of the model:UserWarning",
    "ignore:the default positive=True decides the sign of:UserWarning",
    "ignore:`verify`. the rank still grows past the Lie or gap order:UserWarning",
    "ignore:no effect. .*not a coordinate of the analysis:UserWarning",
    "ignore:a direction is verified, not proven:UserWarning",
    "ignore:a direction is checked at random points only:UserWarning",
]
# a test that runs past this many seconds is a failure, not a hang
timeout = 900

[tool.ruff]
line-length = 120

[tool.ruff.format]
exclude = ["tests/data/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N8"]
ignore = ["E741", "N802", "N803", "N806", "B905", "UP031", "B023"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.codespell]
# identifiers (series, numerator, equilibrate, inhibitor, closure) and author names in refs.bib
ignore-words-list = "ane,bu,clos,equil,fo,hass,inh,loos,mis,nd,numer,ser,statics,te,theis"
skip = "tests/data/*"
