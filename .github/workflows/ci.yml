# The pre-commit hooks (ruff, file checks, no em dashes) and the test suite on a source build, on Linux,
# macOS and Windows with the oldest and the newest supported Python.
name: CI

# master moves only by fast-forward to a commit its pull request has tested
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install from source
        run: python -m pip install ".[test]"
      # outside the checkout, so that the tests import the installed package
      - name: Tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q -n auto "${{ github.workspace }}/tests"
