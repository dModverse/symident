# The pre-commit hooks (ruff, file checks, no em dashes) and the test suite on a source build, on Linux,
# macOS and Windows with the oldest and the newest supported Python.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install from source
        run: python -m pip install ".[test]"
      # outside the checkout, so that the tests import the installed package
      - name: Tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q -n auto "${{ github.workspace }}/tests"
